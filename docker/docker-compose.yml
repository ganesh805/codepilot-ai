services:

  mysql:
    image: mysql:8.4
    container_name: codepilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: codepilot
      MYSQL_USER: codepilot
      MYSQL_PASSWORD: codepilot_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codepilot-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: codepilot-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  redis_data:
  qdrant_data: