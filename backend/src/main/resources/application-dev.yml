spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/codepilot}
    username: ${DB_USERNAME:codepilot}
    password: ${DB_PASSWORD:codepilot_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.codepilot: DEBUG