<div class="app-container">
  <header class="app-header">
    <div class="brand" routerLink="/repositories">
      <span class="logo-icon">⚡</span>
      <span class="brand-name">CodePilot <span class="badge">AI</span></span>
    </div>

    <div class="auth-actions">
      <ng-container *ngIf="authService.isAuthenticated(); else unauthenticated">
        <button class="nav-btn" routerLink="/repositories">
          📂 Repositories
        </button>
        <button class="nav-btn" routerLink="/reviews">
          🛡️ Code Reviewer
        </button>
        <button class="nav-btn" routerLink="/debugger">
          🐛 Debugger
        </button>
        <button class="nav-btn" routerLink="/logs">
          📊 Log Analyzer
        </button>
        <button class="nav-btn" routerLink="/sql-optimizer">
          ⚡ SQL Optimizer
        </button>
        <button class="nav-btn" routerLink="/analytics">
          📈 Analytics
        </button>
        <button class="nav-btn accent-nav" routerLink="/admin" *ngIf="authService.isAdmin()">
          🛡️ Admin Panel
        </button>
        <div class="user-chip">
          <span class="user-name">{{ authService.currentUser()?.firstName }} {{ authService.currentUser()?.lastName }}</span>
          <span class="user-email mono">({{ authService.currentUser()?.username }})</span>
        </div>
        <button class="nav-btn logout-nav" (click)="logout()">Sign Out</button>
      </ng-container>
      <ng-template #unauthenticated>
        <button class="nav-btn" routerLink="/login">Sign In</button>
        <button class="btn-primary" routerLink="/register">Register</button>
      </ng-template>
    </div>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
