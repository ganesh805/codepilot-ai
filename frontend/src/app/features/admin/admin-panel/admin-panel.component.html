<div class="admin-container">
  <div class="admin-header">
    <h1>RBAC User Management & Security Control</h1>
    <p>Manage system users, grant privileges, and inspect tenant security roles.</p>
  </div>

  <div *ngIf="loading" class="loading-state">
    <mat-spinner diameter="36"></mat-spinner>
    <p>Fetching user accounts...</p>
  </div>

  <mat-card *ngIf="!loading" class="user-card">
    <table mat-table [dataSource]="users" class="full-width-table">
      <!-- Username Column -->
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef>Username</th>
        <td mat-cell *matCellDef="let user" class="mono font-bold">{{ user.username }}</td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Full Name</th>
        <td mat-cell *matCellDef="let user">{{ user.firstName }} {{ user.lastName }}</td>
      </ng-container>

      <!-- Roles Column -->
      <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef>Assigned Roles</th>
        <td mat-cell *matCellDef="let user">
          <mat-chip-set>
            <mat-chip *ngFor="let role of user.roles" [class.admin-chip]="role === 'ROLE_ADMIN'" [class.dev-chip]="role === 'ROLE_DEVELOPER'">
              {{ role }}
            </mat-chip>
          </mat-chip-set>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Grant Role</th>
        <td mat-cell *matCellDef="let user">
          <div class="action-buttons">
            <button mat-stroked-button color="primary" *ngIf="!user.roles.includes('ROLE_ADMIN')" (click)="assignRole(user, 'ROLE_ADMIN')">
              + Grant Admin
            </button>
            <button mat-stroked-button *ngIf="!user.roles.includes('ROLE_DEVELOPER')" (click)="assignRole(user, 'ROLE_DEVELOPER')">
              + Grant Developer
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card>
</div>
